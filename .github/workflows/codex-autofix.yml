name: Codex auto-update (retired)

# The scheduled HTML rewriter was retired with the static site.
# Running it against the Next.js app would overwrite source files.
# The old script is kept, unused, at legacy/scripts/codex_update.py.

on:
  workflow_dispatch:

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired
        run: echo "The Codex HTML updater was retired when the site moved to Next.js. See legacy/."
